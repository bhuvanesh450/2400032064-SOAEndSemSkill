name: Docker Compose Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start with Docker Compose
        run: docker compose up --build -d

      - name: Wait for application health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              echo "Application health endpoint is responding."
              exit 0
            fi
            sleep 5
          done
          echo "Application did not become healthy in time."
          docker compose logs
          exit 1

      - name: Verify REST endpoints
        run: |
          curl --fail http://localhost:8080/api/hello
          curl --fail "http://localhost:8080/api/hello?name=CI"
          curl --fail http://localhost:8080/api/info

      - name: Stop containers
        if: always()
        run: docker compose down -v
